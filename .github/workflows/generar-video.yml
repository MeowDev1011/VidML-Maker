name: Generate VidML Video

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Video description'
        required: true
        type: string
      duration:
        description: 'Duration in seconds (3-90)'
        required: true
        default: '30'
        type: string
      style:
        description: 'Visual style'
        required: true
        default: 'Auto'
        type: choice
        options: [Auto, Cyberpunk, Minimalist, Cinematic, Vivid, Retro]
      quality:
        description: 'Quality (Basic=1B model, High/Ultra=3B model)'
        required: true
        default: 'High'
        type: choice
        options: [Basic, High, Ultra]
      aspect_ratio:
        description: 'Aspect ratio'
        required: true
        default: '9:16'
        type: choice
        options: ['9:16', '16:9', '1:1', '4:3', '3:4', '4:5', '5:4', '21:9']
      video_language:
        description: 'Video language'
        required: true
        default: 'English'
        type: string
      subtitles:
        description: 'Include subtitles?'
        required: true
        default: 'no'
        type: choice
        options: ['yes', 'no']
      subtitle_language:
        description: 'Subtitle language'
        required: true
        default: 'Same'
        type: string
      add_music:
        description: 'Include background music?'
        required: true
        default: 'yes'
        type: choice
        options: ['yes', 'no']
      add_voice:
        description: 'Include AI voiceover?'
        required: true
        default: 'yes'
        type: choice
        options: ['yes', 'no']
      reference_image_url:
        description: 'Reference image URL (optional)'
        required: false
        default: ''
        type: string

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          pip install --upgrade pip
          pip install llama-cpp-python playwright requests pillow piper-tts
          playwright install chromium
          playwright install-deps chromium

      - name: Cache Llama models
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/model_cache
          key: llama-models-v1

      - name: Download Llama model
        env:
          QUALITY: ${{ inputs.quality }}
        run: |
          mkdir -p model_cache model
          if [ "$QUALITY" = "Basic" ]; then
            MODEL_URL="https://github.com/MeowDev1011/VidML-Maker/releases/download/llama-models/Llama-3.2-1B-Instruct-Q4_K_M.Light.gguf"
            MODEL_FILE="model_cache/llama-1b.gguf"
          else
            MODEL_URL="https://github.com/MeowDev1011/VidML-Maker/releases/download/llama-models/llama-3.2-3b-instruct.Q3_K_M.gguf"
            MODEL_FILE="model_cache/llama-3b.gguf"
          fi
          if [ ! -f "$MODEL_FILE" ]; then
            echo "Downloading $MODEL_URL"
            wget -q --show-progress "$MODEL_URL" -O "$MODEL_FILE"
          else
            echo "Using cached model: $MODEL_FILE"
          fi
          cp "$MODEL_FILE" model/llama.gguf
          ls -lh model/llama.gguf

      - name: Download Piper TTS voice model
        run: |
          mkdir -p voices
          wget -q --show-progress -O voices/en_US-lessac-medium.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx?download=true"
          wget -q --show-progress -O voices/en_US-lessac-medium.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json?download=true"
          ls -lh voices/

      - name: Generate style pack
        env:
          PROMPT: ${{ inputs.prompt }}
          STYLE: ${{ inputs.style }}
          REFERENCE_IMAGE_URL: ${{ inputs.reference_image_url }}
        run: |
          python <<'PYEOF'
          import os, random, urllib.request
          from io import BytesIO
          from PIL import Image

          prompt = os.environ.get('PROMPT', 'video')
          chosen_style = os.environ.get('STYLE', 'Auto')
          ref_url = os.environ.get('REFERENCE_IMAGE_URL', '')

          palette = None
          if ref_url:
              try:
                  with urllib.request.urlopen(ref_url, timeout=10) as r:
                      img = Image.open(BytesIO(r.read())).convert('RGB')
                  img.thumbnail((100, 100))
                  colors = img.getcolors(maxcolors=100000)
                  colors.sort(key=lambda x: x[0], reverse=True)
                  palette = ['#{:02X}{:02X}{:02X}'.format(*rgb) for _, rgb in colors[:5]]
                  print("Palette extracted: " + str(palette))
              except Exception as e:
                  print("Palette extraction failed: " + str(e))

          if not palette:
              curated = [
                  ["#FF6B6B", "#4ECDC4", "#45B7D1", "#96CEB4", "#FFEAA7"],
                  ["#6C5CE7", "#A29BFE", "#74B9FF", "#0984E3", "#00CEC9"],
                  ["#E17055", "#FDCB6E", "#FFEAA7", "#FAB1A0", "#FF7675"],
                  ["#00B894", "#00CEC9", "#55EFC4", "#81ECEC", "#DFE6E9"],
                  ["#FD79A8", "#E84393", "#D63031", "#FF7675", "#FAB1A0"],
                  ["#A29BFE", "#6C5CE7", "#341F97", "#1B1464", "#0C0032"],
                  ["#F39C12", "#E67E22", "#D35400", "#C0392B", "#7B241C"],
                  ["#1ABC9C", "#16A085", "#27AE60", "#2ECC71", "#58D68D"],
              ]
              palette = random.choice(curated)

          style_library = {
              'Cyberpunk': ["neon glow", "glitch effects", "dark futuristic background", "electric blue and magenta", "scan lines", "holographic text", "chromatic aberration", "grid patterns", "high contrast neon"],
              'Minimalist': ["clean white space", "sans-serif typography", "subtle animations", "monochrome palette", "simple geometric shapes", "smooth transitions", "elegant spacing", "flat design", "minimal motion"],
              'Cinematic': ["film grain", "slow transitions", "warm tones", "letterbox bars", "dramatic lighting", "shallow depth of field", "cinematic aspect ratios", "moody atmosphere", "orchestral pacing"],
              'Vivid': ["saturated colors", "fast-paced animation", "high contrast", "bold typography", "energetic motion", "colorful gradients", "playful shapes", "dynamic transitions", "striking visuals"],
              'Retro': ["vintage color palette", "rounded corners", "paper texture", "retro typography", "film scratches", "analog warmth", "classic patterns", "nostalgic feel", "warm sepia tones"],
              'Auto': ["dynamic animations", "balanced composition", "clear typography", "smooth transitions", "subtle particles", "engaging motion", "modern aesthetic", "visual hierarchy", "professional polish"],
          }
          selected_style = chosen_style if chosen_style in style_library else 'Auto'
          directives = style_library[selected_style]

          style_pack = (
              "STYLE PACK (use these exact details):\n"
              "COLOR PALETTE: " + ', '.join(palette) + "\n"
              "VISUAL STYLE: " + selected_style + "\n"
              "STYLE DIRECTIVES:\n"
              "1. " + directives[0] + "\n"
              "2. " + directives[1] + "\n"
              "3. " + directives[2] + "\n"
              "4. " + directives[3] + "\n"
              "5. " + directives[4] + "\n"
              "6. " + directives[5] + "\n"
              "7. " + directives[6] + "\n"
              "8. " + directives[7] + "\n"
              "9. " + directives[8] + "\n\n"
              "Apply these colors and style directives throughout the video."
          )

          with open('style_pack.txt', 'w', encoding='utf-8') as f:
              f.write(style_pack)
          print("=" * 60)
          print(style_pack)
          print("=" * 60)
          PYEOF

      - name: Generate HTML with Llama
        env:
          PROMPT: ${{ inputs.prompt }}
          DURATION: ${{ inputs.duration }}
          QUALITY: ${{ inputs.quality }}
          ASPECT_RATIO: ${{ inputs.aspect_ratio }}
          VIDEO_LANGUAGE: ${{ inputs.video_language }}
          SUBTITLES: ${{ inputs.subtitles }}
          SUBTITLE_LANGUAGE: ${{ inputs.subtitle_language }}
        run: |
          python <<'PYEOF'
          import os, sys
          from llama_cpp import Llama

          prompt = os.environ['PROMPT']
          duration = os.environ['DURATION']
          quality = os.environ['QUALITY']
          aspect_ratio = os.environ['ASPECT_RATIO']
          video_language = os.environ['VIDEO_LANGUAGE']
          subtitles = os.environ['SUBTITLES']
          subtitle_language = os.environ['SUBTITLE_LANGUAGE']

          ratio_map = {
              '9:16': (480, 854), '16:9': (854, 480), '1:1': (600, 600),
              '4:3': (800, 600), '3:4': (600, 800), '4:5': (600, 750),
              '5:4': (750, 600), '21:9': (960, 411),
          }
          width, height = ratio_map.get(aspect_ratio, (480, 854))

          actual_sub = video_language if subtitle_language == 'Same' else subtitle_language
          sub_text = ("with subtitles in " + actual_sub) if subtitles == 'yes' else "without subtitles"

          with open('style_pack.txt', 'r', encoding='utf-8') as f:
              style_pack = f.read()

          if quality == 'Basic':
              q_instructions = "Create 2 simple scenes with basic CSS animations. Keep the code short."
          elif quality == 'High':
              q_instructions = "Create 3 scenes with GSAP animations, gradients, and animated text."
          else:
              q_instructions = (
                  "ULTRA QUALITY REQUIREMENTS:\n"
                  "1. Create a minimum of 5 distinct, high-quality scenes.\n"
                  "2. Use GSAP for complex animations: timeline sequences, stagger effects, 3D rotations, and morphing SVG shapes.\n"
                  "3. Use professional typography.\n"
                  "4. Define a sophisticated color palette using CSS variables.\n"
                  "5. Do NOT use external images or videos. Use only CSS and inline SVG.\n"
                  "6. Ensure the code is 100% valid and error-free.\n"
                  "7. Add a subtle particle or geometric background animation."
              )

          system_prompt = (
              "You are an expert motion designer. Create a self-contained HTML document for a vertical video ("
              + aspect_ratio + ", " + str(width) + "x" + str(height) + "px) about: \"" + prompt + "\".\n"
              + style_pack + "\n"
              + "Duration: " + duration + "s. Language: " + video_language + ". " + sub_text + ".\n"
              + "Quality: " + quality + ". " + q_instructions + "\n"
              + "Use GSAP (via CDN). Return ONLY raw HTML, starting with <!DOCTYPE html> and ending with </html>. No markdown."
          )

          print("Generating with " + ("1B" if quality == "Basic" else "3B") + " model | Quality: " + quality)

          llm = Llama(model_path="./model/llama.gguf", n_ctx=4096, n_threads=4, verbose=False)
          output = llm(system_prompt, max_tokens=4000, temperature=0.7, stop=["</html>", "<|im_end|>"])
          html = output['choices'][0]['text'].replace('```html', '').replace('```', '').strip()

          if '</html>' not in html:
              html = html + '\n</html>'
          if '<!DOCTYPE html>' not in html and '<html' not in html.lower():
              print("ERROR: Invalid HTML from model", file=sys.stderr)
              sys.exit(1)

          with open('video.html', 'w', encoding='utf-8') as f:
              f.write(html)
          slug = ''.join(c if c.isalnum() else '-' for c in prompt.lower())[:30].strip('-') or 'video'
          with open('slug.txt', 'w') as f:
              f.write(slug)
          with open('dims.txt', 'w') as f:
              f.write(str(width) + "x" + str(height))
          print("HTML generated: " + str(len(html)) + " chars")
          PYEOF

      - name: Generate voiceover with Piper TTS
        if: ${{ inputs.add_voice == 'yes' }}
        env:
          PROMPT: ${{ inputs.prompt }}
        run: |
          echo "Generating voiceover with Piper TTS..."
          echo "Welcome to a video about: $PROMPT. Enjoy the show." | piper --model voices/en_US-lessac-medium.onnx --output_file voice.wav
          ls -lh voice.wav

      - name: Fetch background music
        if: ${{ inputs.add_music == 'yes' }}
        env:
          FREESOUND_KEY: ${{ secrets.FREESOUND_API_KEY }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          python <<'PYEOF'
          import os, requests
          prompt = os.environ['PROMPT']
          key = os.environ.get('FREESOUND_KEY')
          if not key:
              print("FREESOUND_API_KEY not set. Skipping music.")
              exit(0)
          query = ' '.join(prompt.lower().split()[:3])
          try:
              url = "https://freesound.org/apiv2/search/text/?query=" + query + "&token=" + key + "&fields=previews"
              res = requests.get(url, timeout=30)
              data = res.json()
              if data.get('results'):
                  audio_url = data['results'][0]['previews'].get('preview-hq-mp3')
                  if audio_url:
                      audio = requests.get(audio_url, timeout=60)
                      with open('music.mp3', 'wb') as f:
                          f.write(audio.content)
                      print("Music downloaded: " + audio_url)
          except Exception as e:
              print("Music fetch error: " + str(e))
          PYEOF

      - name: Render video with Playwright
        env:
          DURATION: ${{ inputs.duration }}
        run: |
          python <<'PYEOF'
          import asyncio, os, glob
          from playwright.async_api import async_playwright

          duration = int(os.environ['DURATION'])
          with open('dims.txt', 'r') as f:
              dims = f.read().split('x')
              w = int(dims[0])
              h = int(dims[1])
          os.makedirs('videos', exist_ok=True)

          async def render():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(args=['--no-sandbox', '--disable-dev-shm-usage'])
                  context = await browser.new_context(
                      viewport={'width': w, 'height': h},
                      record_video_dir='videos/',
                      record_video_size={'width': w, 'height': h},
                  )
                  page = await context.new_page()
                  await page.goto('file://' + os.getcwd() + '/video.html')
                  await page.wait_for_timeout(duration * 1000 + 1000)
                  await context.close()
                  await browser.close()

          asyncio.run(render())
          webm_files = glob.glob('videos/*.webm')
          if not webm_files:
              raise SystemExit("ERROR: No video recorded")
          print("Recorded: " + webm_files[0])
          with open('recorded_video.txt', 'w') as f:
              f.write(webm_files[0])
          PYEOF

      - name: Combine video, voiceover and music
        env:
          ADD_MUSIC: ${{ inputs.add_music }}
          ADD_VOICE: ${{ inputs.add_voice }}
        run: |
          RECORDED=$(cat recorded_video.txt)
          if [ -f voice.wav ] && [ -f music.mp3 ]; then
            ffmpeg -y -i "$RECORDED" -i voice.wav -i music.mp3 -filter_complex "[1:a]volume=1.0[voice];[2:a]volume=0.3[music];[voice][music]amix=inputs=2:duration=first:dropout_transition=2[aout]" -map 0:v -map "[aout]" -c:v libx264 -preset fast -crf 23 -pix_fmt yuv420p -c:a aac -b:a 128k -shortest video.mp4
          elif [ -f voice.wav ]; then
            ffmpeg -y -i "$RECORDED" -i voice.wav -map 0:v -map 1:a -c:v libx264 -preset fast -crf 23 -pix_fmt yuv420p -c:a aac -b:a 128k -shortest video.mp4
          elif [ -f music.mp3 ]; then
            ffmpeg -y -i "$RECORDED" -i music.mp3 -map 0:v -map 1:a -c:v libx264 -preset fast -crf 23 -pix_fmt yuv420p -c:a aac -b:a 128k -shortest video.mp4
          else
            ffmpeg -y -i "$RECORDED" -c:v libx264 -preset fast -crf 23 -pix_fmt yuv420p video.mp4
          fi
          if [ ! -f video.mp4 ]; then
            echo "ERROR: video.mp4 not created"
            exit 1
          fi
          ls -lh video.mp4

      - name: Create unique filename
        id: filename
        run: |
          SLUG=$(cat slug.txt)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "name=${SLUG}-${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ steps.filename.outputs.name }}
          name: "Video: ${{ inputs.prompt }}"
          body: "Video generated with VidML Maker. Prompt: ${{ inputs.prompt }}. Duration: ${{ inputs.duration }}s. Quality: ${{ inputs.quality }}."
          files: video.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get download URL
        id: url
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/video-${{ steps.filename.outputs.name }}/video.mp4"
          echo "video_url=$URL" >> $GITHUB_OUTPUT
          echo "::notice::Video URL: $URL"

      - name: Clean up old video releases
        uses: actions/github-script@v7
        with:
          script: |
            const MAX_RELEASES = 30;
            const releases = await github.rest.repos.listReleases({ owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            const videoReleases = releases.data.filter(r => r.tag_name.startsWith('video-'));
            const sorted = videoReleases.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            if (sorted.length > MAX_RELEASES) {
              const toDelete = sorted.slice(0, sorted.length - MAX_RELEASES);
              for (const release of toDelete) {
                console.log("Deleting old video: " + release.tag_name);
                await github.rest.repos.deleteRelease({ owner: context.repo.owner, repo: context.repo.repo, release_id: release.id });
                try {
                  await github.rest.git.deleteRef({ owner: context.repo.owner, repo: context.repo.repo, ref: "tags/" + release.tag_name });
                } catch (e) {
                  console.log("Tag already deleted: " + release.tag_name);
                }
              }
            } else {
              console.log("Only " + sorted.length + " video releases. No cleanup needed.");
            }
